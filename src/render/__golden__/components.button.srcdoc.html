<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button</title>
<style>
*, ::before, ::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --color-ink: #000000;
}

.c-button {
  column-gap: 4px;
  container-name: c-button;
  container-type: inline-size;
  display: flex;
  flex-direction: row;
  padding-top: 8px;
  row-gap: 4px;
}

.n-glyph1 {
  flex-shrink: 0;
  width: 16px;
}

.n-label1 {
  color: var(--color-ink);
}

.c-button[data-icon="false"] .n-glyph1 {
  display: none;
}

.c-button[data-tone="danger"] {
  background-color: #ff0000;
}

.c-button:is(:hover, [data-trama-state="hover"]) .n-label1 {
  color: #333333;
}

.c-button:is(:active, [data-trama-state="pressed"]) {
  padding-top: 9px;
}

.c-button[data-tone="danger"]:is(:hover, [data-trama-state="hover"]) .n-label1 {
  color: #ffffff;
}

@container c-button (min-width: 200px) {
  .n-glyph1 {
    width: 24px;
  }
}
</style>
</head>
<body>
  <button class="c-button" data-icon="true" data-tone="danger" data-trama-state="hover" data-id="button">
    <img class="n-glyph1" src="i.svg" alt="" data-id="glyph1">
    <p class="n-label1" data-id="label1">확인</p>
  </button>
</body>
</html>
