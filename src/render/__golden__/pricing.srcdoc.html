<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pricing &amp; Plans</title>
<style>
*, ::before, ::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.n-frame1 {
  display: flex;
  flex-direction: column;
  min-width: 320px;
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-top: env(safe-area-inset-top);
}

.n-head01 {
  align-items: center;
  column-gap: 16px;
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  row-gap: 16px;
}

.n-logo01 {
  align-self: stretch;
  flex-shrink: 0;
  object-fit: contain;
  width: 96px;
}

.n-title1 {
  align-self: stretch;
  flex-basis: 0%;
  flex-grow: 1;
  min-width: 0;
}

.n-grid01 {
  column-gap: 24px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  row-gap: 32px;
}

.n-card01 {
  display: flex;
  flex-direction: column;
  grid-column-end: span 2;
  justify-self: center;
  min-height: 120.5px;
}

.n-card02 {
  display: none;
  flex-direction: column;
}

.n-hero01 {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 240px;
  overflow: hidden;
  position: relative;
}

.n-badge1 {
  display: flex;
  flex-direction: column;
  height: 24px;
  left: 12px;
  position: absolute;
  top: -8px;
  width: 64.5px;
}

.n-dot001 {
  display: flex;
  flex-direction: column;
  height: 8px;
  left: 0px;
  position: absolute;
  top: 0px;
  width: 8px;
}

.n-foot01 {
  display: flex;
  flex-direction: column;
}
</style>
</head>
<body class="n-frame1" data-id="frame1">
  <header class="n-head01" data-id="head01">
    <img class="n-logo01" src="logo.svg" alt="trama" data-id="logo01">
    <h1 class="n-title1" data-id="title1">요금제 &lt;비교&gt;</h1>
  </header>
  <section class="n-grid01" data-id="grid01">
    <div class="n-card01" data-id="card01"></div>
    <div class="n-card02" data-id="card02"></div>
  </section>
  <div class="n-hero01" data-id="hero01">
    <p class="n-lead01" data-id="lead01">흐름 안의 자식</p>
    <div class="n-badge1" data-id="badge1">
      <div class="n-dot001" data-id="dot001"></div>
    </div>
  </div>
  <footer class="n-foot01" data-id="foot01"></footer>
</body>
</html>
